# Project information
site_name: Printer Buddy Docs
site_url: https://docs.printerbuddy.ca/
site_author: sterling5241
copyright: Copyright &copy; 2026 sterling motuz &middot; AGPL-3.0-only

# Repository
repo_name: printer-buddy/printer-buddy
repo_url: https://github.com/printer-buddy/printer-buddy
edit_uri: https://github.com/printer-buddy/printer-buddy-docs/edit/main/docs/

theme:
  name: material
  custom_dir: custom/overrides
  language: en
  logo: assets/images/logo-mascot.png
  favicon: assets/images/favicon.png

  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.footnote.tooltips
    - content.action.edit
    - content.tooltips
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.prune
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# Extra styling CSS
extra_css:
  - assets/stylesheets/extra.css

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

extra:
  social:
    - icon: simple/github
      link: https://github.com/printer-buddy/printer-buddy
    - icon: fontawesome/brands/discord
      link: https://discord.gg/qndnY6WMPx

# Extensions
markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      title: On this page
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Page tree
# per-printer feature pages, linked from Features but not in the menu
not_in_nav: |
  /printers/

nav:
  - Home: index.md
  - Features: features.md
  - Install:
      - install/index.md
      - install/choices.md
      - install/reinstall.md
  - Using it:
      - using/home.md
      - using/printer-page.md
      - using/drawers.md
      - using/ai.md
      - using/timelapse.md
      - using/notifications.md
      - using/camera-streamer.md
      - using/remote.md
  - Updates:
      - updates/index.md
      - updates/dev-builds.md
  - Troubleshooting: troubleshooting.md
  - Coming soon: coming-soon.md
  - Developers:
      - developers/index.md
      - developers/releases.md
      - developers/updater.md
      - developers/apps.md
      - developers/themes.md
      - developers/ai-model.md
